<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Music Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Ambient Animated Background -->
  <div class="background-glow">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="carousel-container">
    
    <!-- SINGLE MUSIC PLAYER CARD -->
    <div class="player-card" data-song-index="0">
      <h2 class="app-title">MECO</h2>

      <div class="top-search-container">
        <input type="text" class="search-input" placeholder="Search track or artist...">
        <button class="search-btn" title="Search"><i class="fas fa-search"></i></button>
      </div>

      <audio class="audio-player"></audio>

      <div class="record-wrapper">
        <div class="vinyl-disc"><div class="vinyl-label"></div></div>
        <div class="cover-jacket">
          <img class="cover-img" src="" alt="Album Cover">
        </div>
      </div>

      <div class="song-info">
        <h3 class="song-title">Song Title</h3>
        <p class="song-artist">Artist Name</p>
      </div>

      <div class="progress-container">
        <span class="current-time">0:00</span>
        <input type="range" class="progress-bar" value="0" max="100">
        <span class="duration-time">0:00</span>
      </div>

      <!-- MAIN CONTROLS (With Shuffle & Repeat) -->
      <div class="controls">
        <button class="btn sub-btn shuffle-btn" title="Shuffle Mode"><i class="fas fa-shuffle"></i></button>
        <button class="btn prev-btn" title="Previous"><i class="fas fa-step-backward"></i></button>
        <button class="btn play-btn" title="Play/Pause"><i class="fas fa-play play-icon"></i></button>
        <button class="btn next-btn" title="Next"><i class="fas fa-step-forward"></i></button>
        <button class="btn sub-btn repeat-btn" title="Repeat Mode"><i class="fas fa-repeat"></i><span class="repeat-badge">1</span></button>
      </div>

      <!-- SECONDARY CONTROLS (Volume & Speed) -->
      <div class="secondary-controls">
        <div class="volume-container">
          <i class="fas fa-volume-up volume-btn" title="Mute/Unmute"></i>
          <input type="range" class="volume-bar" min="0" max="1" step="0.01" value="0.8">
        </div>
        <button class="speed-btn" title="Playback Speed">1x</button>
      </div>

      <div class="playlist-section">
        <h4>Playlist</h4>
        <ul class="playlist"></ul>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
